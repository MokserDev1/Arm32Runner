<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arm32Runner Repository</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background-color: #1e293b;
            border-radius: 18px;
            padding: 32px;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            margin-top: 0;
            font-size: 26px;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-block;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: 0.2s ease-in-out;
        }
        .btn-trollstore {
            background: linear-gradient(135deg, #ef4444, #f97316);
            color: #ffffff;
        }
        .btn-trollstore:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-sileo {
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #ffffff;
        }
        .btn-sileo:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .btn-zebra {
            background-color: #334155;
            color: #e2e8f0;
        }
        .btn-zebra:hover {
            background-color: #475569;
        }
        .repo-url {
            margin-top: 25px;
            padding: 12px;
            background-color: #0f172a;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #cbd5e1;
            word-break: break-all;
            user-select: all;
            border: 1px dashed #475569;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Arm32Runner Repository</h1>
        <p>Run legacy 32-bit (ARMv7) IPAs seamlessly on 64-bit iOS devices with SpringBoard and MobileInstallation integration.</p>
        
        <div class="btn-group">
            <a class="btn btn-trollstore" href="apple-magnifier://install?url=https://raw.githubusercontent.com/MokserDev1/Arm32Runner/main/dist/Talking_Bacteria_Standalone_ARM64.ipa">Install Talking Bacteria (TrollStore)</a>
            <a class="btn btn-sileo" id="sileoBtn" href="sileo://source/">Add to Sileo</a>
            <a class="btn btn-zebra" id="zebraBtn" href="zbra://sources/add/">Add to Zebra</a>
        </div>

        <div class="repo-url" id="repoUrlText"></div>
    </div>

    <script>
        const currentUrl = window.location.href.split('?')[0].split('#')[0];
        document.getElementById("sileoBtn").href = "sileo://source/" + currentUrl;
        document.getElementById("zebraBtn").href = "zbra://sources/add/" + currentUrl;
        document.getElementById("repoUrlText").textContent = currentUrl;
    </script>
</body>
</html>
